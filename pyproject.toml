[project]
name = "agent-loop-demo"
version = "0.1.0"
description = "Agentic analytics demo: LangGraph + MCP + Cube semantic layer + Postgres RLS + local Gemma"
requires-python = ">=3.12"
dependencies = [
    # shared
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "bcrypt>=4.2",
    # data / mcp server
    "mcp>=1.12",
    "psycopg[binary,pool]>=3.2",
    "sqlglot>=25.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "statsmodels>=0.14",
    # agent
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "langchain-mcp-adapters>=0.1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "chainlit>=2.0",
    # observability
    "opentelemetry-sdk>=1.26",
    "opentelemetry-exporter-otlp-proto-http>=1.26",
    "opentelemetry-instrumentation-httpx>=0.47b0",
    "openinference-instrumentation-langchain>=0.1.28",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/mcp_server", "src/agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs the docker compose stack running"]
